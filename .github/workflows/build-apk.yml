name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (if not already present)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Disable predictive back gesture (fixes swipe-back exiting the app)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android:enableOnBackInvokedCallback" "$MANIFEST"; then
            sed -i 's/<application/<application android:enableOnBackInvokedCallback="false"/' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Apply custom app icon
        run: |
          if [ -d "app-icon" ]; then
            echo "Applying custom app icon..."
            for d in app-icon/mipmap-*; do
              density=$(basename "$d")
              mkdir -p "android/app/src/main/res/$density"
              cp "$d"/*.png "android/app/src/main/res/$density/" 2>/dev/null || true
            done
            if [ -f "app-icon/values/ic_launcher_background.xml" ]; then
              mkdir -p android/app/src/main/res/values
              cp "app-icon/values/ic_launcher_background.xml" "android/app/src/main/res/values/ic_launcher_background.xml"
            fi
            echo "Icon files applied:"
            find android/app/src/main/res -iname "ic_launcher*" 
          else
            echo "No app-icon folder found, skipping (using default Capacitor icon)"
          fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcq-practice-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
